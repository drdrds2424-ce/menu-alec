<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منيو المطعم</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>📋 منيو المطعم</h1>
    <div class="actions">
      <button type="button" id="cartBtn">🛒 السلة (<span id="cartCount">0</span>)</button>
      <button type="button" id="adminBtn">⚙️ لوحة التحكم</button>
    </div>
  </header>

  <main class="container">
    <div id="productsGrid" class="grid"></div>
  </main>

  <!-- نافذة السلة -->
  <div id="cartModal" class="modal hidden">
    <div class="modal-content">
      <h2>🛒 سلة الطلبات</h2>
      <div id="cartItems"></div>
      <div class="cart-total">المجموع: <span id="cartTotal">0</span> د.ع</div>
      <button type="button" class="btn-whatsapp" id="sendWhatsappBtn">📱 إرسال الطلب عبر واتساب</button>
      <button type="button" class="btn-close" id="closeCartBtn">إغلاق</button>
    </div>
  </div>

  <!-- نافذة إضافة منتج -->
  <div id="adminModal" class="modal hidden">
    <div class="modal-content">
      <h2>⚙️ إضافة وجبة جديدة</h2>
      <form id="addForm">
        <input type="text" id="pName" placeholder="اسم الوجبة" required>
        <input type="number" id="pPrice" placeholder="السعر (د.ع)" required>
        <input type="url" id="pImg" placeholder="رابط صورة الوجبة" required>
        <button type="submit" class="btn-save">حفظ الوجبة</button>
      </form>
      <button type="button" class="btn-close" id="closeAdminBtn">إغلاق</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
